# Nginx — servidor propio con HTTPS (Let's Encrypt). Ajustar dominio y rutas.
server {
  listen 80;
  server_name movil.ejemplo.com;
  return 301 https://$host$request_uri;   # HTTPS obligatorio
}

server {
  listen 443 ssl http2;
  server_name movil.ejemplo.com;

  ssl_certificate     /etc/letsencrypt/live/movil.ejemplo.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/movil.ejemplo.com/privkey.pem;

  root /var/www/apexos-web-movil/dist;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Proxy inverso a la API (mismo origen → sin CORS). PRODUCCIÓN:
  location /api/ {
    proxy_pass https://apexos-api-prod-production.up.railway.app/api/;
    proxy_set_header Host apexos-api-prod-production.up.railway.app;
    proxy_ssl_server_name on;
    proxy_read_timeout 180s;        # subidas de fotos con mala señal
    client_max_body_size 12m;       # fotos en base64 (≤2 MB c/u) + marcación con selfie y sustento
  }

  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }
}
